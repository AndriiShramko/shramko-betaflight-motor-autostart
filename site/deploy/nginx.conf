# autostart.flyreelstudio.eu - Shramko Motor Autostart: a static release (the configurator runs in the
# visitor's browser and talks to the flight controller over Web Serial) plus a tiny API proxy
# (/api: feedback, reports, counters, health; /go/<slug>: counted redirects).
#
# Mounted read-only into sma-web as /etc/nginx/conf.d/default.conf (a single-file bind mount of
# $SMA_BASE/nginx.conf). deploy.sh refuses to switch a release while the hub's copy, or the copy
# sma-web actually sees, differs from this file; `bash deploy/deploy.sh --sync-config` tests it in a
# throwaway container, writes it in place and reloads (deploy/README.md, "Changing nginx.conf").
#
# Rules this file keeps:
# - add_header inside a location drops every add_header inherited from the server level, so EVERY
#   location repeats the full security header block (the values live in the maps below, once).
# - The API is reached through a variable (proxy_pass $api_upstream...): nginx then resolves
#   "sma-api" per request through Docker's DNS, so `nginx -t` passes without the API container and a
#   recreated API container (new address) is found again within 10 s.
# - Regexes that contain { } must be quoted, or nginx reads the brace as a block.
# - No inline <script> is allowed by the CSP: every script of the web app is a file under 'self'.
# - Permissions-Policy ALLOWS serial=(self) and usb=(self): the configurator needs Web Serial (and
#   WebUSB for a polyfill); blocking them here silently breaks the whole tool.
# - Logs keep no client address and no query string (privacy note on the page): own log_format,
#   referrer reduced to its host, error log only from "crit" up (lower levels name the client).

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;


# requests to /api/*: generous per-visitor ceiling in front of the API's own limits, so a flood
# stops here instead of in the 64 MB API container (keyed by the real client address, see below)
limit_req_zone $binary_remote_addr zone=sma_api:1m rate=10r/s;
limit_req_status 429;

# nginx fixes the map hash bucket size when it parses the FIRST map, so this line must stay above
# every map (the CSP value is a long string)
map_hash_bucket_size 128;

# the referrer, reduced to its host for the access log (a full referrer can carry another site's query)
map $http_referer $sma_ref_host {
    default "-";
    "~^https?://(?<h>[^/:?#]+)" $h;
}
log_format sma_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent ref=$sma_ref_host "$http_user_agent"';

# language for "/": the remembered choice (cookie sma_lang, set by the web app's language switch)
# wins over the browser's first Accept-Language entry; anything else gets English
map $http_accept_language $sma_browser_lang {
    default en;
    "~*^\s*es" es;
    "~*^\s*pl" pl;
    "~*^\s*(ru|uk|be)" ru;
}
map $cookie_sma_lang $sma_cookie_lang {
    default "";
    "~^(en|es|pl|ru)$" $1;
}
map "$sma_cookie_lang:$sma_browser_lang" $sma_lang {
    default $sma_browser_lang;
    "~^(?<c>en|es|pl|ru):" $c;
}

# Header values, written once (a map with only a default is a constant). Enforced CSP: scripts only
# from this origin (+ Google Tag Manager for GA4, which the page loads only after consent), no eval,
# no WebAssembly, no framing. Web Serial / WebUSB need no CSP source: they are browser APIs.
map $uri $sma_csp {
    default "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}
# serial and usb ALLOWED for this origin (the configurator); everything else the site does not use: off
map $uri $sma_permissions {
    default "serial=(self), usb=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), bluetooth=(), hid=(), payment=(), midi=()";
}

server {
    listen 80;
    server_name autostart.flyreelstudio.eu;
    root /srv/releases/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /dev/stdout sma_noip;
    error_log /dev/stderr crit;
    log_not_found off;
    # relative Location headers (/pl/): behind nginx-proxy an absolute redirect would name this
    # container's own scheme and port (http, 80) instead of the visitor's
    absolute_redirect off;

    # Docker's embedded DNS: the API container is looked up per request (cached 10 s)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://sma-api:8090;

    # The client address. nginx-proxy (a private address on web-proxy) appends the visitor's address
    # to X-Forwarded-For; reading from the right and skipping trusted (private) hops lands on that
    # appended address, so a value the visitor writes into the header himself is never used.
    # The API gets exactly this one address in X-Real-IP and X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    error_page 404 /404.html;

    # liveness for the compose healthcheck and the deploy scripts (no file system access)
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        return 200 "ok\n";
    }

    # dotfiles (.git, .env, .DS_Store ...) never leave the server, wherever they sit
    location ~ "/\.(?!well-known/)" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        return 404;
    }

    # "/" -> /en/ /es/ /pl/ /ru/ (cookie first, then Accept-Language); the query string goes along
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        return 302 /$sma_lang/$is_args$args;
    }

    # /en -> /en/ (one canonical address per page)
    location ~ "^/(en|es|pl|ru)$" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        return 301 /$1/$is_args$args;
    }

    # the locale pages: index.html of each locale directory, never cached without revalidation
    location ~ "^/(en|es|pl|ru)/" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        try_files $uri $uri/ =404;
    }

    # hashed build output: the name changes with the content, so cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        try_files $uri =404;
    }

    # which release is live (written by deploy.sh); the deploy and rollback scripts read it back
    location = /release.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        try_files $uri =404;
    }

    # everything else of the release (favicon, robots.txt, sitemap.xml, 404.html, images)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        try_files $uri $uri/ =404;
    }

    # ---- API (sma-api on the internal network only). Every proxied request carries the real client
    # address in X-Real-IP and X-Forwarded-For (never the visitor's own header), no cookies and no
    # credentials. Responses are never cached.

    # bug reports and ideas; a bug may carry diagnostics (the visitor's consent), the only large body
    location = /api/report {
        limit_except POST { deny all; }
        limit_req zone=sma_api burst=20 nodelay;
        client_max_body_size 512k;
        proxy_pass $api_upstream/api/report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    # the contact / collaboration form
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=sma_api burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass $api_upstream/api/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    # the cookieless first-party event counter
    location = /api/e {
        limit_except POST { deny all; }
        limit_req zone=sma_api burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass $api_upstream/api/e;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    # counted redirects (no JS, no cookies): /go/releases, /go/bfapp ... (api/go-targets.json)
    location /go/ {
        limit_except GET { deny all; }
        limit_req zone=sma_api burst=20 nodelay;
        proxy_pass $api_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    # aggregated counters for the owner: only from inside sma-web itself
    # (docker exec sma-web wget -qO- http://127.0.0.1/api/stats). $realip_remote_addr is the address
    # of the TCP peer before the real-IP module: a forged X-Forwarded-For: 127.0.0.1 that came in
    # through the proxy does not pass.
    location = /api/stats {
        allow 127.0.0.1;
        deny all;
        if ($realip_remote_addr != "127.0.0.1") {
            return 403;
        }
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
    }

    # any other /api/ path: a JSON 404 from here, never the static site and never the API
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sma_permissions always;
        add_header Content-Security-Policy $sma_csp always;
        return 404 "{\"ok\":false}\n";
    }
}
